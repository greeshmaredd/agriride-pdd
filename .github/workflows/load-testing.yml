name: Baseline & Concurrency Load Testing & Excel Report

on:
  push:
    branches: [ "main", "master", "ci/**", "test/**", "load-tests" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  baseline-load-tests:
    name: Run Baseline Load Test (100 VUs, 60s) & Generate Excel Report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python openpyxl
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Execute 100 Virtual Users Baseline Load Test (60 Seconds)
        working-directory: ./load-tests
        env:
          CONCURRENT_USERS: 100
          DURATION_SEC: 60
        run: |
          echo "Starting 100 Virtual Users Concurrency Benchmark (60 continuous seconds)..."
          node load-test.js

      - name: Generate 4-Sheet Professional Excel Benchmark Report
        working-directory: ./load-tests
        run: |
          echo "Generating Excel Load Testing Report..."
          python generate_load_report.py load-results.json AgriRide_Load_Testing_Report.xlsx
          ls -la AgriRide_Load_Testing_Report.xlsx

      - name: Upload Excel Load Test Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AgriRide-Baseline-Load-Test-Report
          path: load-tests/AgriRide_Load_Testing_Report.xlsx
          retention-days: 30

      - name: Publish Load Test Summary to GitHub Actions Summary
        working-directory: ./load-tests
        run: |
          python publish_summary.py
