<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AgriRide 2026 — Entire App Real Device Screenshots (35 Screens)</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #0A0F0D; color: #F0FDF4; padding: 24px; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-family: 'Outfit', sans-serif; font-size: 32px; font-weight: 800; color: #22C55E; margin-bottom: 8px; }
    p { color: #86EFAC; font-size: 15px; }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .card {
      background: #141F18;
      border: 1px solid #1E382B;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-4px); border-color: #22C55E; }
    .card-header {
      padding: 12px 16px;
      background: #0E1712;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #1E382B;
    }
    .badge {
      background: #15803D;
      color: #DCFCE7;
      font-weight: 700;
      font-size: 12px;
      padding: 4px 8px;
      border-radius: 6px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #ECFDF5;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .card-img-wrapper {
      padding: 12px;
      display: flex;
      justify-content: center;
      background: #080D0A;
    }
    .card img {
      width: 100%;
      height: auto;
      max-height: 520px;
      object-fit: contain;
      border-radius: 12px;
    }
    .card-footer {
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0E1712;
      border-top: 1px solid #1E382B;
    }
    .download-btn {
      color: #4ADE80;
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 12px;
      background: rgba(34, 197, 94, 0.15);
      border-radius: 6px;
      transition: background 0.2s;
    }
    .download-btn:hover { background: rgba(34, 197, 94, 0.3); }
  </style>
</head>
<body>
  <header>
    <h1>🚜 AgriRide 2026 — Entire App Native Screenshots</h1>
    <p>35 Screens Captured Directly from Real Device (SM-S711B) • Order by Order</p>
  </header>

  <div class="gallery-grid" id="grid">
    <!-- Populated by JS -->
  </div>

  <script>
    const screens = [
      "01_Splash_Screen",
      "02_Onboarding_Intro",
      "03_Language_Selection",
      "04_Login_Screen",
      "05_Register_Create_Account",
      "06_OTP_Verification",
      "07_Farmer_Home_Dashboard",
      "08_Equipment_Categories",
      "09_Equipment_Search_and_Filter",
      "10_Equipment_Details",
      "11_Select_Farming_Activity",
      "12_Booking_Details_Form",
      "13_Smart_Scheduling_Weather",
      "14_Booking_Summary",
      "15_Payment_Options",
      "16_Booking_Success",
      "17_Weather_Dashboard",
      "18_Disaster_and_Weather_Alerts",
      "19_Soil_and_Crop_AI_Recommendation",
      "20_Crop_Dam_Live_Map",
      "21_Farmer_Community_Group_Chat",
      "22_Equipment_Owner_Dashboard",
      "23_Add_New_Equipment_Form",
      "24_Vehicle_Document_Verification",
      "25_Owner_Booking_Requests",
      "26_Owner_Earnings_and_Workers",
      "27_Owner_Weekly_Trends",
      "28_Owner_Equipment_Fleet",
      "29_Owner_Notifications",
      "30_Worker_Dashboard",
      "31_Worker_Tasks_and_Attendance",
      "32_Worker_Task_Details",
      "33_AgriStore_Cart",
      "34_User_Profile_and_Settings",
      "35_Admin_Control_Center"
    ];

    const grid = document.getElementById('grid');
    screens.forEach((name, idx) => {
      const num = String(idx + 1).padStart(2, '0');
      const cleanTitle = name.replace(/^\d+_/, '').replace(/_/g, ' ');
      const filename = `${name}.png`;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-header">
          <span class="badge">Screen ${num}</span>
          <span class="card-title">${cleanTitle}</span>
        </div>
        <div class="card-img-wrapper">
          <a href="${filename}" target="_blank">
            <img src="${filename}" alt="Screen ${num}: ${cleanTitle}" loading="lazy" />
          </a>
        </div>
        <div class="card-footer">
          <span style="font-size:12px; color:#86EFAC;">Native Real Device</span>
          <a class="download-btn" href="${filename}" download="${filename}">Download</a>
        </div>
      `;
      grid.appendChild(card);
    });
  </script>
</body>
</html>
